    <!-- los enlaces o anclas o hipervinculos.-->    
    <!-- a (anchor) significa ancla. Metafora:como en un barco te mantiene en una ubicacion especifica un ancla es justamente para que el usuario sepa hacia donde buscar un recurso o hacia donde navegar en la pagina web-->

    <!-- los atrbutos son caracteristicas quye definen el comportamiento y la apariencia de los elemantos en este caso el atributo href vuelve funcional a la etiqueta es por esta razon que se utiliza en el maquetado y no en el css dado que  nos es una caracteristica visual
        -->
    <!-- herf (hyper reference) es la referencia a un recurso, es decir le destino del enlace -->

    <!-- lo que esta adentro de la etiqueta a es el texto visible que el usuario vera en la pagina web. Mientras que lo que esta adentro de herf es la referencia al recurso al que apunta el enlace -->
    <h2 title="Titulo de la pagina">Enlaces o anclas</h2>
    <!-- por otra parte, el atributo title proporciona un texto de ayuda que se muestra uando el usuario pasa el mouse sobre el enlace. las tecnologias de asistencia como lectores de pantalla utiliza este atributo para proporcionar informacion adicional   al usuario. en el caso de personas invidentes esto les permite acceder a infomacion adicional sobre enlaces. -->

    <h2>Enlaces con target a otra ventana</h2>
