<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
    <!-- http://techicons.dev/icons/react -->
</head>
<body>
    <!-- Etiquetas de bloque y etiquetas de linea  -->
     <h1>Imagenes</h1>
     <!-- las imagenes insertadas en HTML utilizando la etiqueta img. Esta etiqueta es un elemto vacio lo que significa que no tiene una etiqueta de cierre. la sintaxis basica para insertar uan imagene: -->
      <!-- vale la pena reordar que el atributo title proporciona un tooltip que se muestra cuando el usuario pasa el mouse sobre la imagen -->
        <img src="real.jpg" alt="foto real" title="foto" width="200" height="200">

        <!-- self closing tag son etiquetas que se auto cierran -->
</body>
</html>
